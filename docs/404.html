<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Page not found — SLwire</title>
  <meta name="robots" content="noindex">
  <link rel="icon" type="image/png" href="assets/icon.png">
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      color: #e9f2f5;
      background:
        radial-gradient(ellipse 60% 50% at 50% 0%, rgba(61, 220, 155, 0.1), transparent 70%),
        #070b0f;
      font-family: "Segoe UI", system-ui, sans-serif;
      text-align: center;
    }
    .wrap { max-width: 460px; }
    img { width: 64px; height: 64px; border-radius: 16px; box-shadow: 0 0 0 1px rgba(255,255,255,.1); }
    p { margin: 22px 0 8px; color: #74efb5; font-size: 11px; font-weight: 700; letter-spacing: .15em; text-transform: uppercase; }
    h1 { margin: 0; font-size: clamp(2rem, 6vw, 3rem); letter-spacing: -.05em; }
    span { display: block; margin: 12px 0 26px; color: #8ba0ac; font-size: 14px; line-height: 1.7; }
    a {
      display: inline-flex;
      align-items: center;
      min-height: 46px;
      padding: 0 18px;
      border-radius: 11px;
      color: #04120d;
      background: linear-gradient(135deg, #99fac9, #3ddc9b);
      font-size: 13px;
      font-weight: 700;
    }
  </style>
</head>
<body>
  <main class="wrap">
    <img src="assets/icon.png" alt="SLwire">
    <p>404 · lost packet</p>
    <h1>This page went off-grid.</h1>
    <span>The address does not point to an SLwire page. Head back to the download page.</span>
    <a href="./">Back to SLwire</a>
  </main>
</body>
</html>
